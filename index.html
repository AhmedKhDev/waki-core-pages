<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>WAKI Core</title>
<style>
  :root { --bg: #F0F4F9; --card: #FFFFFF; --text: #0D2B5E; --muted: #6B7280; --link: #2260B8; --accent: #E8922D; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1121; --card: #0E1628; --text: #E0EDFB; --muted: #B8BCC5; --link: #8AB5EA; --accent: #F0AC55; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 64px auto; padding: 32px 24px; background: var(--card); border-radius: 16px; border-top: 4px solid var(--accent); }
  @media (max-width: 600px) { main { margin: 0; border-radius: 0; padding: 24px 16px; } }
  h1 { margin: 0 0 8px; font-size: 1.75rem; }
  p { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
<h1>WAKI Core</h1>
<p>The internal management app of Wakid Pharmaceutical Industries.</p>
<ul>
  <li><a href="privacy/">Privacy Policy</a></li>
  <li><a href="support/">Support</a></li>
</ul>
</main>
</body>
</html>
